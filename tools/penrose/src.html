<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Penrose</title>
<style>
  /* Sizes use vh/vmin so the page reads the same in a small LMS iframe and on a projector. */
  :root { --bg: #000; --ink: #f4fbff; --line: rgba(190,235,255,.55); --glow: #7fe4ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font: 600 max(16px, 2.6vh)/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  /* the monitor trace along the bottom edge */
  #trace { position: fixed; left: 0; right: 0; bottom: 2.5vh; width: 100%; height: 9vh; pointer-events: none; opacity: 0; }
  /* small labels that point at the neuron and the microtubules */
  .label { position: fixed; left: 0; top: 0; pointer-events: none; opacity: 0; white-space: nowrap;
    font-size: max(20px, 3.8vh); letter-spacing: .06em; color: #eafaff;
    text-shadow: 0 0 1.4vh rgba(95,216,255,.95), 0 0 .3vh #000; display: flex; align-items: center; gap: 1vh; }
  .label::before { content: ""; width: 5vh; height: 2px; background: rgba(200,240,255,.8); box-shadow: 0 0 .8vh rgba(95,216,255,.9); }
  /* light that fills the screen going into the axon, and the warm one coming back out */
  #flash, #flash2 { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
  #flash { background: radial-gradient(circle at 50% 50%, #d9f7ff 0%, #4fc6ee 22%, #0d4868 55%, #02101c 100%); }
  #flash2 { background: radial-gradient(circle at 50% 50%, #fffaf0 0%, #ffd98a 25%, #a8661c 60%, #1c0e02 100%); }
  /* black veil: dark first frame and the final fade */
  #veil { position: fixed; inset: 0; pointer-events: none; background: #000; opacity: 1; }
  #play { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 2;
    width: max(110px, 24vmin); height: max(110px, 24vmin); border-radius: 50%; cursor: pointer;
    border: max(3px, .5vmin) solid var(--line); background: rgba(127,228,255,.1); color: var(--ink);
    display: grid; place-items: center; box-shadow: 0 0 6vmin rgba(127,228,255,.35), inset 0 0 4vmin rgba(127,228,255,.2);
    transition: background .2s, box-shadow .2s; }
  #play:hover { background: rgba(127,228,255,.2); box-shadow: 0 0 9vmin rgba(127,228,255,.5), inset 0 0 4vmin rgba(127,228,255,.3); }
  #play svg { width: 42%; height: 42%; margin-left: 8%; fill: var(--ink); }
  #play span { position: absolute; top: 100%; margin-top: 2.4vh; font-size: max(20px, 4vh); letter-spacing: .08em; white-space: nowrap; }
  #replay { position: fixed; right: max(16px, 3vh); bottom: max(16px, 3vh); z-index: 2; cursor: pointer;
    font: inherit; font-size: max(16px, 2.8vh); color: var(--ink); background: rgba(127,228,255,.12);
    border: 2px solid var(--line); border-radius: 999px; padding: .45em 1.2em; }
  #replay:hover { background: rgba(127,228,255,.24); }
  button:focus-visible { outline: 3px solid var(--glow); outline-offset: 4px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="stage"></div>
<canvas id="trace"></canvas>
<div class="label" id="lab-neuron"></div>
<div class="label" id="lab-mt"></div>
<div id="flash"></div>
<div id="flash2"></div>
<div id="veil"></div>
<button id="play" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5v17l14-8.5z"/></svg><span></span></button>
<button id="replay" type="button" hidden></button>

<script>/*THREE*/</script>
<script>
// ======================================================================
// ON-SCREEN WORDING. Change the text here; nothing else needs touching.
// ======================================================================
const WORDS = {
  play: 'Play',                   // label under the large Play button
  replay: 'Replay',               // small button shown after the scene ends
  neuron: 'neuron',               // label beside the neuron (shot 2)
  microtubules: 'microtubules',   // label inside the axon (shot 3)
};
// ======================================================================

// ---- timeline (seconds after Play) ----
const T = {
  FLY: 2.8,          // camera starts moving in through the head
  AT_NEURON: 6.5,    // the whole neuron is in view
  NEURON_LABEL: 5.6, // 'neuron' label shows from here for LABEL_S seconds
  INTO_AXON: 6.9,    // camera turns along the axon and goes inside
  ARRIVE: 9.4,       // camera is inside the axon; switch to the inside view
  MT_LABEL: 10.4,    // 'microtubules' label shows from here for LABEL_S seconds
  LABEL_S: 2.0,
  SYNC0: 12.2,       // the tubes' flickers start to fall into step...
  SYNC1: 15.6,       // ...and are fully in step from here
  PULSE: 1.15,       // seconds per shared pulse
  SPIKE_AT: 9,       // the spike comes on this pulse after ARRIVE (about 3.5 shared pulses before it)
};
T.ENDING = T.ARRIVE + T.SPIKE_AT * T.PULSE;   // the spike; the ending takes over from here
const ENDINGS = { wake: { duration: 8.8, run: endingWake } };
const ENDING = 'wake';
const TOTAL = T.ENDING + ENDINGS[ENDING].duration;

// ---- colours ----
const CYAN = new THREE.Color('#5fd8ff');
const GOLD = new THREE.Color('#ffc65a');

const $ = s => document.querySelector(s);
$('#play span').textContent = WORDS.play;
$('#play').setAttribute('aria-label', WORDS.play);
$('#replay').textContent = WORDS.replay;
$('#lab-neuron').textContent = WORDS.neuron;
$('#lab-mt').textContent = WORDS.microtubules;

const clamp01 = x => Math.min(1, Math.max(0, x));
const ramp = (t, a, b) => clamp01((t - a) / (b - a));
const smooth = x => x * x * (3 - 2 * x);
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const lerp = (a, b, k) => a + (b - a) * k;
const fract = x => x - Math.floor(x);
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const rr = (a, b) => a + (b - a) * rnd();

// ---- renderer ----
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(0x000000, 1);
$('#stage').appendChild(renderer.domElement);
const camera = new THREE.PerspectiveCamera(40, 1, 0.002, 100);

function canvasTex(size, draw) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const dotTex = canvasTex(64, (g, s) => {
  const r = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.25, 'rgba(255,255,255,.8)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, s, s);
});
const add = { transparent: true, depthWrite: false, blending: THREE.AdditiveBlending };
function glowSprite(color, opacity = 1, map = dotTex) {
  return new THREE.Sprite(new THREE.SpriteMaterial({ map, color, opacity, ...add }));
}
// glowing edges (brighter where a surface turns away from the camera)
function rimMaterial(color, extraUniforms = {}, vertexHead = '', vertexBody = '') {
  return new THREE.ShaderMaterial({
    uniforms: { uColor: { value: color.clone() }, uOpacity: { value: 0 }, uFill: { value: .035 }, ...extraUniforms },
    vertexShader: `varying vec3 vN; varying vec3 vV; varying float vY; ${vertexHead}
      void main(){ vec3 p = position; vec3 n = normal; ${vertexBody}
        vY = position.y; vec4 mv = modelViewMatrix * vec4(p,1.); vN = normalize(normalMatrix*n); vV = normalize(-mv.xyz); gl_Position = projectionMatrix*mv; }`,
    fragmentShader: `uniform vec3 uColor; uniform float uOpacity, uFill; varying vec3 vN; varying vec3 vV; varying float vY;
      void main(){ float f = 1. - abs(dot(normalize(vN), normalize(vV))); float g = pow(f, 2.6)*1.25 + uFill;
        g *= smoothstep(-3.3, -2.3, vY);   // the body dissolves downwards, so no bottom edge shows on tall screens
        gl_FragColor = vec4(uColor*g*uOpacity, 1.); }`,
    side: THREE.DoubleSide, ...add,
  });
}

// ======================================================================
// PART 1: the person, and the neuron inside the head
// ======================================================================
const headScene = new THREE.Scene();

// head-and-shoulders outline, revolved; shoulders flattened front-to-back
const PROFILE = [[0, -3.6], [2.1, -3.6], [2.05, -2.4], [2.0, -1.9], [1.75, -1.45], [1.2, -1.22], [0.58, -1.08], [0.43, -0.95],
  [0.41, -0.62], [0.5, -0.42], [0.66, -0.12], [0.76, 0.2], [0.8, 0.52], [0.75, 0.86], [0.6, 1.14], [0.36, 1.32], [0.001, 1.4]];
const outline = new THREE.SplineCurve(PROFILE.map(([r, y]) => new THREE.Vector2(r, y))).getPoints(90);   // smooth the corners
const lathe = new THREE.LatheGeometry(outline, 72);
const flatten = y => lerp(1.08, 0.42, smooth(ramp(y, -0.95, -1.3)));   // head round, shoulders flat
{
  const p = lathe.attributes.position;
  for (let i = 0; i < p.count; i++) p.setZ(i, p.getZ(i) * flatten(p.getY(i)));
  lathe.computeVertexNormals();
}
// the head bows forward from the neck (unconscious) and lifts again on waking
const PIVOT = new THREE.Vector3(0, -0.95, 0);
const BOW = 0.38, LIFTED = -0.05;
const neckWeight = y => smooth(ramp(y, -1.15, -0.7));
const rimMat = rimMaterial(CYAN, { uBow: { value: BOW } },
  `uniform float uBow;
   vec3 bow(vec3 v, float a){ float c = cos(a), s = sin(a); return vec3(v.x, v.y*c - v.z*s, v.y*s + v.z*c); }`,
  `float a = uBow * smoothstep(-1.15, -.7, p.y); p = bow(p - vec3(0., -.95, 0.), a) + vec3(0., -.95, 0.); n = bow(n, a);`);
const silhouette = new THREE.Mesh(lathe, rimMat);
headScene.add(silhouette);

// fine glowing dust on the surface of the silhouette
function profileAt(y) {
  for (let i = 1; i < PROFILE.length; i++) {
    const [r0, y0] = PROFILE[i - 1], [r1, y1] = PROFILE[i];
    if (y <= y1) return lerp(r0, r1, (y - y0) / (y1 - y0 || 1));
  }
  return 0;
}
const skinBase = [], skinCol = [];
for (let i = 0; i < 1600; i++) {
  const y = rr(-3.2, 1.38), a = rr(0, Math.PI * 2), r = profileAt(y);
  skinBase.push(Math.cos(a) * r, y, Math.sin(a) * r * flatten(y));
  const c = smooth(ramp(y, -3.2, -2.3)); skinCol.push(c, c, c);
}
const skinGeo = new THREE.BufferGeometry();
skinGeo.setAttribute('position', new THREE.Float32BufferAttribute(skinBase, 3));
skinGeo.setAttribute('color', new THREE.Float32BufferAttribute(skinCol, 3));
const skinMat = new THREE.PointsMaterial({ map: dotTex, color: 0x9fe8ff, vertexColors: true, size: 0.035, opacity: 0, ...add });
headScene.add(new THREE.Points(skinGeo, skinMat));

// everything inside the head turns with it about the neck
const headGroup = new THREE.Group(), headInner = new THREE.Group();
headGroup.position.copy(PIVOT); headInner.position.copy(PIVOT).negate();
headGroup.add(headInner); headScene.add(headGroup);

let bowNow = null;
function setBow(a) {
  if (a === bowNow) return;
  bowNow = a;
  rimMat.uniforms.uBow.value = a;
  headGroup.rotation.x = a;
  const p = skinGeo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = skinBase[i * 3], y = skinBase[i * 3 + 1] - PIVOT.y, z = skinBase[i * 3 + 2];
    const b = a * neckWeight(skinBase[i * 3 + 1]), c = Math.cos(b), s = Math.sin(b);
    p.setXYZ(i, x, y * c - z * s + PIVOT.y, y * s + z * c);
  }
  p.needsUpdate = true;
  headScene.updateMatrixWorld();
}

// background neurons: thin branching lines and glowing cell bodies
const SOMA = new THREE.Vector3(0.16, 0.6, 0.12);      // the neuron the camera visits
function branch(from, dir, len, depth, out) {
  const to = from.clone().addScaledVector(dir, len);
  out.push(from.x, from.y, from.z, to.x, to.y, to.z);
  if (depth <= 0) return;
  const n = depth > 1 ? 2 : 1 + (rnd() < .5 ? 1 : 0);
  for (let i = 0; i < n; i++) {
    const d = dir.clone().add(new THREE.Vector3(rr(-.9, .9), rr(-.9, .9), rr(-.9, .9))).normalize();
    branch(to, d, len * rr(.55, .8), depth - 1, out);
  }
}
const neuronSegs = [], somas = [];
while (somas.length < 20) {
  const c = new THREE.Vector3(rr(-.52, .52), rr(0.05, 1.05), rr(-.45, .45));
  if (c.distanceTo(SOMA) < 0.32 || c.distanceTo(new THREE.Vector3(0.05, 0.25, 0.02)) < 0.22) continue;   // keep clear of the visited neuron
  somas.push(c);
  for (let k = 0; k < 4; k++) branch(c, new THREE.Vector3(rr(-1, 1), rr(-1, 1), rr(-1, 1)).normalize(), 0.09, 2, neuronSegs);
}
const nGeo = new THREE.BufferGeometry();
nGeo.setAttribute('position', new THREE.Float32BufferAttribute(neuronSegs, 3));
const nMat = new THREE.LineBasicMaterial({ color: 0x55c8ff, opacity: 0, ...add });
headInner.add(new THREE.LineSegments(nGeo, nMat));
const somaSprites = somas.map(p => {
  const s = glowSprite(0x6fd4ff, 0); s.position.copy(p); s.scale.setScalar(0.06); headInner.add(s); return s;
});

// THE neuron: cell body, tapering dendrites (one long apical dendrite upwards), one long axon
const cellMat = rimMaterial(CYAN);
cellMat.uniforms.uFill.value = 0.12;
const neuron = new THREE.Group();
headInner.add(neuron);
const soma = new THREE.Mesh(new THREE.SphereGeometry(0.026, 20, 14), cellMat);
soma.position.copy(SOMA); soma.scale.set(1, 1.3, 1); neuron.add(soma);
const somaGlow = glowSprite(0xbff2ff, 0); somaGlow.position.copy(SOMA); somaGlow.scale.setScalar(0.12); neuron.add(somaGlow);
function dendrite(from, dir, len, radius, depth) {
  const mid = from.clone().addScaledVector(dir, len * .5).add(new THREE.Vector3(rr(-1, 1), rr(-1, 1), rr(-1, 1)).multiplyScalar(len * .12));
  const to = from.clone().addScaledVector(dir, len);
  neuron.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([from, mid, to]), 8, radius, 5), cellMat));
  if (depth <= 0) return;
  for (let i = 0; i < 2; i++) {
    const d = dir.clone().add(new THREE.Vector3(rr(-.8, .8), rr(-.8, .8), rr(-.8, .8))).normalize();
    dendrite(to, d, len * rr(.55, .75), radius * .7, depth - 1);
  }
}
dendrite(SOMA.clone().add({ x: 0, y: .03, z: 0 }), new THREE.Vector3(.1, 1, .05).normalize(), 0.16, 0.0045, 3);   // apical
for (let i = 0; i < 5; i++) {
  const a = i / 5 * Math.PI * 2 + rr(-.3, .3);
  const d = new THREE.Vector3(Math.cos(a), rr(-.5, .25), Math.sin(a)).normalize();
  dendrite(SOMA.clone().addScaledVector(d, .02), d, rr(.08, .12), 0.0035, 2);
}
const axonCurve = new THREE.CatmullRomCurve3([
  SOMA.clone().add({ x: 0, y: -0.03, z: 0 }), new THREE.Vector3(0.14, 0.48, 0.13), new THREE.Vector3(0.09, 0.33, 0.1),
  new THREE.Vector3(0.05, 0.18, 0.03), new THREE.Vector3(0.0, 0.04, -0.03), new THREE.Vector3(-0.08, -0.08, -0.06),
]);
neuron.add(new THREE.Mesh(new THREE.TubeGeometry(axonCurve, 90, 0.0055, 8), cellMat));
{ // axon terminals: a few short twigs with small glowing ends
  const end = axonCurve.getPoint(1), dir = axonCurve.getTangent(1);
  for (let i = 0; i < 4; i++) {
    const d = dir.clone().add(new THREE.Vector3(rr(-.9, .9), rr(-.6, .6), rr(-.9, .9))).normalize();
    const to = end.clone().addScaledVector(d, rr(.04, .07));
    neuron.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.LineCurve3(end, to), 2, 0.0025, 5), cellMat));
    const b = glowSprite(0x9fe8ff, 0); b.position.copy(to); b.scale.setScalar(0.02); neuron.add(b);
  }
}
const neuronLights = neuron.children.filter(c => c.isSprite);

// faint far dust so the black is not empty
function dustField(n, spread, color, size) {
  const a = [];
  for (let i = 0; i < n; i++) a.push(rr(-spread, spread), rr(-spread * .7, spread * .7), rr(-spread, -2));
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(a, 3));
  return new THREE.Points(g, new THREE.PointsMaterial({ map: dotTex, color, size, opacity: 0, ...add }));
}
const headDust = dustField(260, 12, 0x3d7fa8, 0.06);
headScene.add(headDust);
const aura = glowSprite(0x4fc6ee, 0); aura.position.set(0, 0.35, -0.6); aura.scale.setScalar(4.2); headScene.add(aura);

// ---- camera path through the head: k = 0 outside, 1 looking at the neuron, 2 inside the axon ----
const CAM0 = new THREE.Vector3(1.7, 0.0, 7.0), LOOK0 = new THREE.Vector3(0, -0.55, 0);
const NEURON_C = new THREE.Vector3(0.1, 0.27, 0.06);     // middle of the neuron, cell body plus upper axon
const VIEW1 = NEURON_C.clone().add({ x: 0.2, y: 0.12, z: 1.35 });
const intoAxon = new THREE.CatmullRomCurve3([
  VIEW1, axonCurve.getPoint(0.12).add({ x: 0.06, y: 0.03, z: 0.16 }),
  axonCurve.getPoint(0.3).add({ x: 0.01, y: 0.015, z: 0.03 }), axonCurve.getPoint(0.5),
]);
const w = v => headInner.localToWorld(v);     // head-space point -> world
const lookV = new THREE.Vector3();
function camPose(t, k) {
  if (k <= 1) {
    const start = CAM0.clone().setZ(CAM0.z - 0.25 * smooth(ramp(t, 0, T.FLY)));
    camera.position.lerpVectors(start, w(VIEW1.clone()), k);
    camera.position.y += Math.sin(k * Math.PI) * 0.15;       // a slight arc, not a straight line
    lookV.lerpVectors(LOOK0, w(NEURON_C.clone()), smooth(ramp(k, 0, 0.7)));
  } else {
    const b = k - 1;
    camera.position.copy(w(intoAxon.getPoint(b)));
    lookV.lerpVectors(w(NEURON_C.clone()), w(axonCurve.getPoint(lerp(0.35, 0.95, b))), smooth(ramp(b, 0, 0.45)));
  }
  camera.lookAt(lookV);
}

// k: camera position on the path; wake: 0 unconscious .. 1 awake; echo: gold afterglow of the spike in the neuron
function updateHead(t, k, wake, bow, echo) {
  setBow(bow);
  camPose(t, k);
  const on = smooth(ramp(t, 0.1, 1.2));
  const inside = smooth(ramp(k, 0.72, 0.98));                         // camera has passed through the surface
  const slow = Math.pow(0.5 + 0.5 * Math.sin(t * Math.PI * 2 / 3.4 - 1.5), 2);   // the slow, faint pulse while unconscious
  rimMat.uniforms.uOpacity.value = on * lerp(0.2 + 0.06 * slow, 1, wake) * (1 - inside);
  rimMat.uniforms.uFill.value = lerp(0.035, 0.085, wake);
  skinMat.opacity = on * lerp(0.1, 0.6, wake) * (1 - inside);
  headDust.material.opacity = on * 0.5;
  aura.material.opacity = on * wake * 0.22;

  const near = smooth(ramp(k, 0.15, 0.8));                            // neurons light up as the camera approaches
  const level = on * lerp(0.1 + 0.25 * slow, 0.8, Math.max(near, wake));
  nMat.opacity = level * 0.75;
  somaSprites.forEach((s, i) => {
    const tw = wake > 0 ? lerp(1, 0.55 + 0.45 * Math.sin(t * 5.3 + i * 1.7), wake) : 1;   // awake: lively twinkle
    s.material.opacity = level * tw;
  });
  const focus = Math.max(level, on * smooth(ramp(k, 0.3, 0.9)));
  const shown = focus * (1 - smooth(ramp(k, 1.4, 1.75)));            // hide the neuron once we are inside its axon
  cellMat.uniforms.uOpacity.value = shown * 1.15;
  cellMat.uniforms.uColor.value.copy(CYAN).lerp(GOLD, echo);
  neuronLights.forEach(s => { s.material.opacity = shown; s.material.color.set(0xbff2ff).lerp(GOLD, echo); });
  somaGlow.scale.setScalar(0.12 + 0.1 * echo);
}

function headFly(t) {
  const k = ease(ramp(t, T.FLY, T.AT_NEURON)) + ease(ramp(t, T.INTO_AXON, T.ARRIVE));
  updateHead(t, k, 0, BOW, 0);
}

// ======================================================================
// PART 2: inside the axon. Microtubules run lengthwise in a loose bundle.
// ======================================================================
const cellScene = new THREE.Scene();
const AXON_R = 4.2;           // the axon's own membrane around the bundle
const TUBE_R = 0.11;
const X0 = -3.0;              // where along the bundle the shared pulse (and the spark) set off
const LAMBDA = 14;            // length of one shared pulse along the bundle (long: the whole bundle lights almost together)
const tubeShared = {
  uOpacity: { value: 0 }, uSync: { value: 0 }, uActivity: { value: 0 },
  uSpark: { value: -99 }, uLit: { value: 0 }, uAfter: { value: 0 },
  uCyan: { value: CYAN.clone() }, uGold: { value: GOLD.clone() },
};
const tubeVert = `varying vec3 vN; varying vec3 vV; varying vec2 vUv; varying float vS;
  void main(){ vUv = uv; vec4 w = modelMatrix*vec4(position,1.); vS = w.x;
    vec4 mv = viewMatrix*w; vN = normalize(normalMatrix*normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix*mv; }`;
const tubeFrag = `uniform float uOpacity, uSync, uActivity, uSpark, uLit, uAfter, uPhase, uAmp; uniform vec3 uCyan, uGold;
  varying vec3 vN; varying vec3 vV; varying vec2 vUv; varying float vS;
  void main(){
    float f = 1. - abs(dot(normalize(vN), normalize(vV)));
    float rim = pow(f, 1.5);
    // rings of tubulin units stacked along the tube (fade the rings out where they would get too fine to draw)
    float r = vS * 15.;
    float ringW = fwidth(r);
    float ring = mix(smoothstep(.0, .2, abs(fract(r) - .5)), .8, smoothstep(.25, .6, ringW));
    float seg = .55 + .45*ring;
    float pf = .82 + .18*smoothstep(.3, .5, abs(fract(vUv.x*13.) - .5));   // 13 protofilaments
    vec3 col = uCyan * (.05 + .42*rim) * seg * pf;
    // activity: own flicker when out of step; one pulse travelling along the bundle when in step
    float ph = uPhase - uSync*(vS - ${X0.toFixed(2)})/${LAMBDA.toFixed(2)};
    float g = exp(-fract(ph)*4.5) * uAmp * uActivity;
    col += mix(uCyan, vec3(1.), .45) * g * (.3 + 1.2*rim) * seg;
    // the spike passing along, the warm trail it leaves, and the bloom
    float d = vS - uSpark;
    float head = exp(-d*d*9.) * uLit;
    float trail = smoothstep(.2, -2.2, d) * smoothstep(-6., -1.5, d) * uLit;
    col += uGold * (head*1.4 + trail*.22) * (.4 + .6*rim) + uGold * uAfter * (.25 + .9*rim);
    gl_FragColor = vec4(col*uOpacity, 1.);
  }`;

// lay out the tracks in the axon's cross-section; each track has one or two tubes with staggered, open ends
const tracks = [new THREE.Vector2(0, 0)];
while (tracks.length < 18) {
  const a = rr(0, Math.PI * 2), r = Math.sqrt(rnd()) * 1.05, p = new THREE.Vector2(Math.cos(a) * r, Math.sin(a) * r);
  if (tracks.every(q => q.distanceTo(p) > 0.33)) tracks.push(p);
}
const tubes = [];
function addTube(p, x0, len) {
  const mat = new THREE.ShaderMaterial({ uniforms: { ...tubeShared, uPhase: { value: 0 }, uAmp: { value: 0 } },
    vertexShader: tubeVert, fragmentShader: tubeFrag, side: THREE.DoubleSide, ...add });
  const m = new THREE.Mesh(new THREE.CylinderGeometry(TUBE_R, TUBE_R, len, 18, 1, true), mat);
  m.rotation.set(rr(-.015, .015), rr(-.015, .015), -Math.PI / 2 + rr(-.012, .012));   // loosely, not perfectly, parallel
  m.position.set(x0 + len / 2, p.x, p.y);
  cellScene.add(m);
  tubes.push({ mat, off: rnd(), rate: rr(-.35, .35), w1: rr(1.2, 2.6), q1: rr(0, 6.3), w2: rr(2.5, 4.5), q2: rr(0, 6.3),
    w3: rr(1.5, 3.5), q3: rr(0, 6.3) });
}
tracks.forEach((p, i) => {
  if (i === 0) { addTube(p, -16, 32); return; }       // the centre track is unbroken: the spark runs along it
  let x = rr(-15, -3.5);
  while (x < 14) { const len = rr(7, 13); addTube(p, x, len); x += len + rr(0.5, 1.4); }
});

// the axon's membrane around us, and drifting specks in the axoplasm
const membrane = new THREE.Mesh(new THREE.CylinderGeometry(AXON_R, AXON_R, 40, 40, 1, true), rimMaterial(CYAN));
membrane.rotation.z = Math.PI / 2;
membrane.material.uniforms.uFill.value = 0.0;
membrane.material.uniforms.uColor.value.set('#2d7fb0');
cellScene.add(membrane);
const plasma = [];
for (let i = 0; i < 700; i++) { const a = rr(0, 6.3), r = Math.sqrt(rnd()) * (AXON_R - .2); plasma.push(rr(-16, 16), Math.cos(a) * r, Math.sin(a) * r); }
const plasmaGeo = new THREE.BufferGeometry(); plasmaGeo.setAttribute('position', new THREE.Float32BufferAttribute(plasma, 3));
const cellDust = new THREE.Points(plasmaGeo, new THREE.PointsMaterial({ map: dotTex, color: 0x4aa6d6, size: 0.04, opacity: 0, ...add }));
cellScene.add(cellDust);

const syncAmount = t => smooth(ramp(t, T.SYNC0, T.SYNC1));
const CELL_CAM = new THREE.Vector3(-4.3, 1.5, 3.1), CELL_LOOK = new THREE.Vector3(0.6, -0.15, 0);
const MT_ANCHOR = new THREE.Vector3(-1.2, 1.25, 0.2);     // where the 'microtubules' label points
const camIn = new THREE.Vector3(-12, 0.2, 0.25);
function updateCell(t, look = CELL_LOOK, activity = 1) {
  // arrive travelling along the axon, then settle beside the bundle and drift slowly
  const a = ease(ramp(t, T.ARRIVE, T.ARRIVE + 2.2));
  camera.position.lerpVectors(camIn, CELL_CAM, a);
  camera.position.x += 0.35 * ramp(t, T.ARRIVE, TOTAL);
  const lk = new THREE.Vector3().lerpVectors(camera.position.clone().add({ x: 4, y: 0, z: 0 }), look, smooth(ramp(t, T.ARRIVE + .3, T.ARRIVE + 2.2)));
  camera.lookAt(lk);

  const arrive = smooth(ramp(t, T.ARRIVE - 0.2, T.ARRIVE + 0.9));
  tubeShared.uOpacity.value = arrive;
  tubeShared.uActivity.value = activity * smooth(ramp(t, T.ARRIVE + 0.4, T.ARRIVE + 2));
  const m = syncAmount(t);
  tubeShared.uSync.value = m;
  const base = (t - T.ARRIVE) / T.PULSE;
  for (const tb of tubes) {
    const own = tb.off + (t - T.ARRIVE) * tb.rate + 0.3 * Math.sin(t * tb.w1 + tb.q1) + 0.15 * Math.sin(t * tb.w2 + tb.q2);
    tb.mat.uniforms.uPhase.value = base + (1 - m) * own;
    tb.mat.uniforms.uAmp.value = lerp(0.3 + 0.7 * Math.pow(0.5 + 0.5 * Math.sin(t * tb.w3 + tb.q3), 2), 1, m);
  }
  membrane.material.uniforms.uOpacity.value = arrive * 0.35;
  cellDust.material.opacity = arrive * 0.5;
  cellDust.position.x = -0.12 * t;
}

// ======================================================================
// THE SPARK. Built once, kept separate so it can be reused elsewhere.
// Look: white-hot core, thin golden ring, long four-point star with
// shorter diagonal rays, and a short comet tail.
// ======================================================================
function makeSpark() {
  const coreTex = canvasTex(128, (g, s) => {
    const r = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.12, 'rgba(255,252,236,1)');
    r.addColorStop(.3, 'rgba(255,206,110,.6)'); r.addColorStop(.62, 'rgba(255,150,50,.16)'); r.addColorStop(1, 'rgba(255,120,30,0)');
    g.fillStyle = r; g.fillRect(0, 0, s, s);
  });
  const ringTex = canvasTex(256, (g, s) => {
    g.strokeStyle = 'rgba(255,228,160,.95)'; g.lineWidth = s * 0.018; g.shadowColor = 'rgba(255,190,80,1)'; g.shadowBlur = s * 0.05;
    g.beginPath(); g.arc(s / 2, s / 2, s * 0.36, 0, Math.PI * 2); g.stroke(); g.stroke();
  });
  const rayTex = canvasTex(512, (g, s) => {
    const c = s / 2;
    const ray = (ang, len, w) => {
      g.save(); g.translate(c, c); g.rotate(ang);
      const lg = g.createLinearGradient(0, 0, len, 0);
      lg.addColorStop(0, 'rgba(255,250,230,1)'); lg.addColorStop(.35, 'rgba(255,214,130,.55)'); lg.addColorStop(1, 'rgba(255,170,60,0)');
      g.fillStyle = lg; g.beginPath(); g.moveTo(0, -w); g.lineTo(len, 0); g.lineTo(0, w); g.closePath(); g.fill(); g.restore();
    };
    for (let i = 0; i < 4; i++) ray(i * Math.PI / 2, c * 0.98, s * 0.012);
    for (let i = 0; i < 4; i++) ray(Math.PI / 4 + i * Math.PI / 2, c * 0.42, s * 0.008);
  });
  const group = new THREE.Group();
  const halo = glowSprite(0xffa640, 0, coreTex), core = glowSprite(0xffffff, 0, coreTex);
  const ring = glowSprite(0xffffff, 0, ringTex), rays = glowSprite(0xffffff, 0, rayTex);
  group.add(halo, ring, rays, core);
  const tail = [];
  for (let i = 0; i < 16; i++) { const s = glowSprite(0xffd38a, 0, coreTex); tail.push(s); group.add(s); }
  return {
    group,
    // pos: where the spark is; path(dt) gives its position dt seconds ago (for the tail)
    update(time, pos, size, opacity, path) {
      const fl = 1 + 0.06 * Math.sin(time * 41) + 0.04 * Math.sin(time * 23.7);
      for (const s of [halo, core, ring, rays]) s.position.copy(pos);
      core.scale.setScalar(size * 0.55 * fl); core.material.opacity = opacity;
      halo.scale.setScalar(size * 1.6); halo.material.opacity = opacity * 0.55;
      ring.scale.setScalar(size * (1.15 + 0.06 * Math.sin(time * 6))); ring.material.opacity = opacity * 0.85;
      rays.scale.setScalar(size * 2.4 * fl); rays.material.opacity = opacity; rays.material.rotation = time * 0.35;
      tail.forEach((s, i) => {
        const k = 1 - i / tail.length;
        if (path) s.position.copy(path((i + 1) * 0.022)); else s.position.copy(pos);
        s.scale.setScalar(size * 0.42 * k); s.material.opacity = path ? opacity * k * 0.5 : 0;
      });
    },
  };
}
const spark = makeSpark();
cellScene.add(spark.group);
const wash = glowSprite(0xffcf7a, 0, spark.group.children[0].material.map);   // the bloom that fills the view
cellScene.add(wash);

// ======================================================================
// THE TRACE along the bottom edge, like a monitor. Ragged noise while the
// tubes are out of step, a small steady rhythm once in step, one sharp
// spike at T.ENDING, then a calm regular rhythm.
// ======================================================================
const traceCanvas = $('#trace'), tg = traceCanvas.getContext('2d');
const hash = n => fract(Math.sin(n * 127.1) * 43758.5453) * 2 - 1;
const vnoise = x => { const i = Math.floor(x), f = x - i; return lerp(hash(i), hash(i + 1), smooth(f)); };
function traceValue(x) {
  const m = syncAmount(x);
  const ragged = (vnoise(x * 14) * 0.65 + vnoise(x * 37 + 7) * 0.35) * 0.32;
  const beat = (Math.exp(-fract((x - T.ARRIVE) / T.PULSE) * 7) - 0.15) * 0.28;
  const ds = x - T.ENDING;
  const spike = Math.exp(-Math.pow(ds / 0.028, 2)) - 0.32 * Math.exp(-Math.pow((ds - 0.075) / 0.035, 2));
  const calm = 0.13 * Math.sin(ds * Math.PI * 2 / 1.5);
  return lerp(lerp(ragged, beat, m), calm, smooth(ramp(ds, 0.12, 0.9))) + (Math.abs(ds) < 0.4 ? spike : 0);
}
const TRACE_SPAN = 5;       // seconds shown across the width
function drawTrace(t, alpha) {
  traceCanvas.style.opacity = alpha.toFixed(3);
  if (alpha <= 0) return;
  const W = traceCanvas.width, H = traceCanvas.height, mid = H * 0.6, amp = H * 0.5;
  tg.clearRect(0, 0, W, H);
  tg.lineJoin = 'round';
  tg.beginPath();
  const step = Math.max(1, Math.round(W / 700));
  for (let px = 0; px <= W; px += step) {
    const y = mid - traceValue(t - TRACE_SPAN * (1 - px / W)) * amp;
    px ? tg.lineTo(px, y) : tg.moveTo(px, y);
  }
  // a wide faint stroke under a thin one gives a soft glow without canvas blur (which is slow on phones)
  tg.lineWidth = Math.max(4, H * 0.07); tg.strokeStyle = 'rgba(95,216,255,.12)'; tg.stroke();
  tg.lineWidth = Math.max(1.5, H * 0.02); tg.strokeStyle = 'rgba(150,222,255,.45)'; tg.stroke();
}

// ======================================================================
// ENDING "wake": the spike comes out of the shared pulse, runs along the
// bundle and blooms; the camera pulls back out of the neuron and the head;
// the person, now fully lit, lifts their head. Hold, then fade to dark.
// te = seconds since T.ENDING. Returns which scene to draw and the overlays.
// A second ending can be added to ENDINGS above; it gets the same scene.
// ======================================================================
function endingWake(t, te) {
  const RUN = 1.7, BLOOM = 2.4, SWITCH = 2.8, BACK = 5.6, LIFT0 = 5.0, LIFT1 = 6.5, FADE0 = 7.6, END = 8.8;
  const traceAlpha = 1 - smooth(ramp(te, 2.6, 4.2));          // the trace fades as the camera pulls back
  if (te < SWITCH) {
    const X1 = 3.4;
    const sAt = tt => lerp(X0, X1, Math.pow(ramp(tt, 0, RUN), 1.5));   // accelerating run
    const sNow = sAt(te);
    const look = new THREE.Vector3().lerpVectors(CELL_LOOK, new THREE.Vector3(X1, 0, 0), smooth(ramp(te, 0.2, BLOOM)));
    updateCell(t, look, 1 - 0.8 * smooth(ramp(te, 0, 1.2)));
    const pos = new THREE.Vector3(sNow, 0, 0);
    const appear = smooth(ramp(te, 0, 0.15));
    const bloom = smooth(ramp(te, RUN - 0.1, BLOOM));
    const near = camera.position.distanceTo(pos) / 4;       // keep its size on screen as it moves away
    spark.update(t, pos, (0.5 + 1.9 * bloom) * near, appear, te < RUN ? dt => new THREE.Vector3(sAt(te - dt), 0, 0) : null);
    tubeShared.uSpark.value = te < RUN + 0.4 ? sNow : 99;
    tubeShared.uLit.value = appear * (1 - bloom);
    tubeShared.uAfter.value = bloom * 0.7;
    wash.position.copy(pos);
    wash.scale.setScalar(lerp(1, 16, bloom) * near);
    wash.material.opacity = bloom * 0.75;
    return { scene: cellScene, dark: 0, flash: smooth(ramp(te, BLOOM - 0.2, SWITCH)), trace: traceAlpha };
  }
  const k = 2 * (1 - ease(ramp(te, SWITCH, BACK)));                  // the fly-in path, backwards
  const wake = smooth(ramp(te, SWITCH + 0.6, BACK));
  const bow = lerp(BOW, LIFTED, ease(ramp(te, LIFT0, LIFT1)));
  updateHead(t, k, wake, bow, 1 - smooth(ramp(te, SWITCH, BACK + 0.5)));
  return { scene: headScene, dark: smooth(ramp(te, FADE0, END)), flash: 1 - smooth(ramp(te, SWITCH, SWITCH + 0.7)), trace: traceAlpha };
}

function resetEnding() {
  spark.update(0, new THREE.Vector3(), 0.01, 0, null);
  tubeShared.uSpark.value = -99; tubeShared.uLit.value = 0; tubeShared.uAfter.value = 0;
  wash.material.opacity = 0;
}

// ======================================================================
// framing, labels, playback
// ======================================================================
function resize() {
  const w = window.innerWidth, h = window.innerHeight, a = w / h;
  renderer.setSize(w, h, false);
  camera.aspect = a;
  // keep at least ~40 deg across in portrait too, so nothing is cut off on phones
  camera.fov = a >= 1 ? 40 : Math.min(80, 2 * Math.atan(Math.tan(20 * Math.PI / 180) / a) * 180 / Math.PI);
  camera.updateProjectionMatrix();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  traceCanvas.width = Math.round(traceCanvas.clientWidth * dpr); traceCanvas.height = Math.round(traceCanvas.clientHeight * dpr);
}

const labelAlpha = (t, t0) => smooth(ramp(t, t0, t0 + 0.4)) * (1 - smooth(ramp(t, t0 + T.LABEL_S - 0.4, t0 + T.LABEL_S)));
const pv = new THREE.Vector3();
function placeLabel(el, world, alpha) {
  el.style.opacity = alpha.toFixed(3);
  if (alpha <= 0) return;
  pv.copy(world).project(camera);
  const W = window.innerWidth, H = window.innerHeight, gap = H * 0.015;
  const x = Math.min(W - el.offsetWidth - 16, Math.max(16, (pv.x + 1) / 2 * W + gap));
  const y = Math.min(H * 0.8, Math.max(16, (1 - pv.y) / 2 * H - el.offsetHeight / 2));
  el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)`;
}

const flash = $('#flash'), flash2 = $('#flash2'), veil = $('#veil');
function frame(t) {
  let dark = 1 - smooth(ramp(t, 0, 0.6)), f1 = 0, f2 = 0, scene, trace = 1;
  if (t < T.ARRIVE) {
    resetEnding();
    headFly(t);
    scene = headScene;
    f1 = smooth(ramp(t, T.ARRIVE - 1.0, T.ARRIVE));
  } else if (t < T.ENDING) {
    resetEnding();
    updateCell(t);
    scene = cellScene;
    f1 = 1 - ramp(t, T.ARRIVE, T.ARRIVE + 1.0);
  } else {
    const r = ENDINGS[ENDING].run(t, t - T.ENDING);
    scene = r.scene; dark = Math.max(dark, r.dark); f2 = r.flash; trace = r.trace;
  }
  renderer.render(scene, camera);
  placeLabel($('#lab-neuron'), w(SOMA.clone()), t < T.ARRIVE ? labelAlpha(t, T.NEURON_LABEL) : 0);
  placeLabel($('#lab-mt'), MT_ANCHOR, scene === cellScene ? labelAlpha(t, T.MT_LABEL) : 0);
  drawTrace(t, smooth(ramp(t, T.ARRIVE + 0.4, T.ARRIVE + 1.6)) * trace);
  flash.style.opacity = f1.toFixed(3);
  flash2.style.opacity = f2.toFixed(3);
  veil.style.opacity = dark.toFixed(3);
}

let playing = false, clock = 0, last = 0;
function tick(now) {
  if (!playing) return;
  clock += Math.min(0.1, (now - last) / 1000);   // a hidden tab pauses instead of skipping ahead
  last = now;
  frame(Math.min(clock, TOTAL));
  if (clock >= TOTAL) { playing = false; $('#replay').hidden = false; $('#replay').focus({ preventScroll: true }); return; }
  requestAnimationFrame(tick);
}
function play() {
  $('#play').hidden = true; $('#replay').hidden = true;
  clock = 0; playing = true; last = performance.now();
  requestAnimationFrame(tick);
}
$('#play').addEventListener('click', play);
$('#replay').addEventListener('click', play);
window.addEventListener('resize', () => { resize(); if (!playing) frame(clock ? TOTAL : 0); });
resize();
frame(0);
</script>
</body>
</html>
